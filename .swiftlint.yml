only_rules:
  - array_init
  - compiler_protocol_init
  - control_statement
  - closure_end_indentation
  - cyclomatic_complexity
  - duplicate_imports
  - ibinspectable_in_extension
  - duplicate_enum_cases
  - enum_case_associated_values_count
  - fallthrough
  - fatal_error_message
  - flatmap_over_map_reduce
  - first_where
  - for_where
  - force_cast
  - force_try
  - implicit_getter
  - operator_usage_whitespace
  - function_name_whitespace
  - pattern_matching_keywords
  - large_tuple
  - weak_delegate

  # Contains
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison

  # Empty
  - empty_count
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - empty_string
  - empty_xctest_method
  - empty_enum_arguments

  - explicit_init

  # Redundancy
  - redundant_nil_coalescing
  - redundant_objc_attribute
  - implicit_optional_initialization
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_void_return
  - redundant_discardable_let
  - redundant_type_annotation

  # Private
  - private_action
  - private_over_fileprivate
  - private_unit_test
  - private_outlet

  # Spacing
  - closing_brace
  - closure_spacing
  - colon
  - file_name_no_space
  - no_space_in_method_call
  - opening_brace
  - vertical_whitespace
  - return_arrow_whitespace

  # Unused
  - unused_closure_parameter
  - unused_declaration
  - unused_import
  - unused_optional_binding
  - unused_setter_value
  - unused_enumerated
  - unused_control_flow_label

  # Unneeded
  - unneeded_synthesized_initializer
  - unneeded_break_in_switch
  - unneeded_parentheses_in_closure_argument

  # Trailing
  - trailing_comma
  - trailing_semicolon

  # Alignment
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces

  # Order
  - protocol_property_accessors_order
  - sorted_imports
  - modifier_order

  # Length & complexity
  - line_length
  - type_body_length
  - function_body_length
  - nesting

  # Others
  - shorthand_operator
  - sorted_first_last
  - syntactic_sugar
  - statement_position
  - yoda_condition
  - toggle_bool
  - legacy_random
  - custom_rules

  # Spacing
  - comma
  - comment_spacing

  # Naming
  - identifier_name
  - file_name

  # SwiftUI
  - private_swiftui_state

custom_rules:
  redundant_true_comparison:
    regex: "== true"
    message: "Comparison of a boolean with true is redundant. Just use the boolean value."
    severity: error

  redundant_false_comparison:
    regex: "== false"
    message: "Comparison of a boolean with false is redundant. Use the negation operator (!) instead."
    severity: error

  discourage_print:
    included: ".*.swift"
    name: "print_usage"
    regex: "((\\bprint)|(Swift\\.print))\\s*\\("
    message: "Prefer os_log over print"
    severity: error

  strong_self:
    included: ".*.swift"
    name: "Use weak self in closures"
    regex: "\\{\\s*[^\\[]{0,50}\\s+\\bin\\b([a-zA-Z\\\\.\\(\\)\\[\\{\\}\\>\\/\\=]|\\s)+(self)[^!]"
    message: "Use weak self when create a closure."
    severity: warning

  dont_import_ui_kits:
    included: ".*(?i)(ViewModel|Model|DataSource).swift"
    name: "Don't import UI frameworks in ViewModel/Model/DataSource"
    regex: "^import (UIKit|AVKit|MapKit|WatchKit|CoreGraphics|CoreAnimation|CoreImage|CoreML|SpriteKit|SceneKit|ARKit|WebKit|Metal)$"
    message: "Don't import specific frameworks in ViewModel/Model/DataSource"
    severity: error

included:
  - App Traffic Inspector
  - AppTrafficInspectorTests

identifier_name:
  min_length:
    error: 3
    warning: 4
  max_length:
    error: 70
    warning: 60
  excluded: ["i", "j", "url"]

file_name:
  excluded: []

cyclomatic_complexity:
  warning: 10
  error: 15

line_length:
  warning: 120
  error: 200

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 50
  error: 100

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 4

reporter: "xcode"
